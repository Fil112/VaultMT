# ==========================================================
# VaultMT - Конфигурация независимого ядра экономики
# ==========================================================

# Настройки API и интеграций
api:
  # Включить поддержку PlaceholderAPI (%vaultmt_balance%, %vaultmt_formatted% и др.)
  enable-papi: true

# Настройки сети (BungeeCord / Velocity)
network:
  # Включите, если Bukkit работает в связке с прокси-сервером.
  # Позволяет отправлять пакеты для глобальных уведомлений о переводах (/pay)
  bungee-mode: false

# Базовые настройки экономики
economy:
  default-currency: "mt" # Внутреннее имя основной валюты
  start-balance: 100.0   # Стартовый баланс для новых игроков

  # Настройка отображения валюты (используется в PlaceholderAPI и сообщениях)
  currency:
    symbol: "$"
    format: "%.2f %sym%" # %sym% заменится на символ выше

  # Продвинутая мультивалютность (Задел на будущее API)
  currencies:
    mt:
      name: "Монеты"
      allow-pay: true
    donate:
      name: "Рубины"
      allow-pay: false

# Настройки базы данных (ВАЖНО: пути должны совпадать с кодом Provider.java)
database:
  type: "sqlite" # Типы: sqlite (локально), mysql (для сетей Bungee/Velocity)
  mysql:
    host: "127.0.0.1"
    port: "3306"
    database: "vaultmt"
    username: "root"
    password: "password123"
    use-ssl: false

# Внутренние настройки плагина (используются в командах /emt)
settings:
  language: "ru_RU"

  # Лимиты для команды /pay
  limits:
    min-pay: 1.0
    max-pay: 100000.0

  # Статическая комиссия на переводы (0.05 = 5%)
  transfer-fee: 0.05

  # Система динамического налога (переопределяет transfer-fee, если включена)
  dynamic-tax:
    enabled: true
    default-rate: 0.01 # Налог 1% для сумм ниже первого порога
    brackets:
      # Формат "сумма:ставка". Сортируйте строго от меньшего к большему!
      - "1000:0.02"    # От 1 000 налог 2%
      - "5000:0.05"    # От 5 000 налог 5%
      - "25000:0.10"   # От 25 000 налог 10%

  # Черный список никнеймов, которым запрещены финансовые операции (/pay)
  blacklist:
    - "ScammerPlayer1"
    - "DupeMaster99"

  check-updates: true
  debug: false