name: VaultMT
version: '${project.version}'
main: mt.vault.bukkit.VaultMTBukkit
load: STARTUP

softdepend:
  - PlaceholderAPI

authors: [ Keylo ]
description: "Core economy engine for MT Studio ecosystem."
website: "https://github.com/Fil112/VaultMT"
folia-supported: true
prefix: VaultMT

# ==========================================
# Регистрация команд
# ==========================================
commands:
  emt:
    description: "Главная команда администрирования VaultMT."
    usage: "§cИспользование: /emt help"
    permission: vaultmt.admin
    aliases: [vaultmt, vmt]

  pay:
    description: "Перевести средства другому игроку."
    usage: "§cИспользование: /pay <игрок> <сумма>"
    permission: vaultmt.pay

  balance:
    description: "Проверить свой или чужой баланс."
    usage: "§cИспользование: /balance [игрок]"
    permission: vaultmt.balance
    aliases: [bal]

# ==========================================
# Регистрация прав (Permissions)
# ==========================================
permissions:
  vaultmt.admin:
    description: "Полный доступ ко всем командам (выдача/списание, статистика, логи, релоад)."
    default: op

  vaultmt.pay:
    description: "Разрешает использовать команду перевода средств."
    default: true

  vaultmt.balance:
    description: "Разрешает проверять баланс."
    default: true